<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" role="img" aria-labelledby="title desc">
<title id="title">HoverFX tooltip demonstration</title>
<desc id="desc">A demonstration price is hovered and a minimal card displays USD to INR and the converted price.</desc>
<defs><filter id="soft" x="-30%" y="-50%" width="170%" height="210%"><feGaussianBlur stdDeviation="17"/></filter><filter id="shadow" x="-20%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#263c31" flood-opacity=".13"/></filter></defs>
<rect width="940" height="640" fill="#f0f4ef"/>
<rect x="78" y="66" width="784" height="504" rx="19" fill="#fff" stroke="#e2e8e2"/>
<circle cx="115" cy="98" r="5.5" fill="#e5eae5"/><circle cx="134" cy="98" r="5.5" fill="#e5eae5"/><circle cx="153" cy="98" r="5.5" fill="#e5eae5"/>
<path d="M78 128H862" stroke="#e2e8e2"/>
<text x="128" y="185" font-size="13" font-family="Arial, sans-serif" font-weight="700" letter-spacing="3" fill="#768478">STUDIO GOODS</text>
<text x="128" y="256" font-size="38" font-family="Arial, sans-serif" font-weight="600" fill="#1c2821">Everyday essentials.</text>
<text x="128" y="299" font-size="17" font-family="Arial, sans-serif" fill="#718074">A price is easier to understand in your currency.</text>
<text x="128" y="394" font-size="39" font-family="Arial, sans-serif" font-weight="700" fill="#1c2821">$129.00</text>
<path d="M127 408H275" stroke="#367758" stroke-width="3"/>
<g filter="url(#shadow)"><rect x="330" y="365" width="250" height="101" rx="10" fill="#ffffff" stroke="#dde5de"/></g>
<text x="349" y="394" font-size="13" font-weight="600" font-family="Arial, sans-serif" fill="#69786d">USD → INR</text>
<text x="349" y="438" font-size="28" font-weight="700" font-family="Arial, sans-serif" fill="#202b23">₹10,845.50</text>
<text x="128" y="526" font-family="Arial, sans-serif" font-size="13" fill="#88968a">Illustrative conversion · Tooltip shown at larger scale</text>
</svg>